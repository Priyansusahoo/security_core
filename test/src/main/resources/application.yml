spring:
  application:
    name: ${SPRING_APP_NAME:security-service}

  datasource:
    url: ${DATASOURCE_URL:changeme}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:changeme}
    driver-class-name: ${DB_DRIVER_CLASS_NAME:org.postgresql.Driver}

    hikari:
      pool-name: ${HIKARI_POOL_NAME:EasyByteHikariPool}
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:10}
      minimum-idle: ${HIKARI_MIN_IDLE:2}
      connection-timeout: ${HIKARI_CONNECTION_TIMEOUT:30000}
      idle-timeout: ${HIKARI_IDLE_TIMEOUT:600000}
      max-lifetime: ${HIKARI_MAX_LIFETIME:1800000}

  jpa:
    hibernate:
      ddl-auto: ${JPA_HIBERNATE_DDL_AUTO:validate}
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        "[format_sql]": ${JPA_PROPERTIES_HIBERNATE_FORMAT_SQL:false}
        dialect:  ${JPA_PROPERTIES_HIBERNATE_DIALECT:org.hibernate.dialect.PostgreSQLDialect}

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: "0"

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      password: ${REDIS_PASSWORD:Test@1234}
      port: ${REDIS_PORT:6379}
      timeout: ${REDIS_TIMEOUT:10000}

  mail:
    username: ${SPRING_MAIL_USERNAME:noreply.modelx.store@gmail.com}
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    password: ${GMAIL_APP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

application:
  security:
    jwt:
      secret: ${JWT_SECRET:changeme}
      expiration: ${JWT_EXPIRATION:86400000} # 24 hours
    otp:
      expiration: ${OTP_EXPIRATION:5m}
      length: ${OTP_LENGTH:6}
      max-attempts: ${OTP_MAX_ATTEMPTS:3}
      resend-cooldown: ${OTP_RESEND_COOLDOWN:60s}
      storage-type: ${OTP_STORAGE_TYPE:REDIS} # Choose DB, REDIS, or MEMORY
    mfa:
      enabled: true
      challenge-ttl: 5m
      storage-type: ${MFA_STORAGE_TYPE:REDIS} # Choose DB, REDIS, or MEMORY

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  file:
    name: logs/server-prod.log
  logback:
    rollingpolicy:
      max-file-size: 500MB
      max-history: 30
      clean-history-on-start: false
  level:
    "[org.springframework.web]": "debug"
    "[org.hibernate]": "error"